<div class="not-found">
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <p><a href="/">Go to the homepage</a></p>
</div>

<script>
// Redirect old Django site PDF paths to new Jekyll paths
// Old: /site_data/pub_pdf/foo.pdf  →  New: /assets/pdfs/foo.pdf
var path = window.location.pathname;
var match = path.match(/^\/site_data\/pub_pdf\/(.+\.pdf)$/i);
if (match) {
  window.location.replace('/assets/pdfs/' + match[1]);
}
</script>
